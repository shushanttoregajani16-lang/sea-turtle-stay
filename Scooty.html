<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Rent a Scooty | Sea Turtle Stay</title>

  <link rel="stylesheet" href="style.css">

  <style>
    .scooty-page {
      background: #faf9f5;
      min-height: 100vh;
    }

    .scooty-hero {
      min-height: 620px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 80px 20px;

      background:
        linear-gradient(rgba(0,0,0,.4), rgba(0,0,0,.4)),
        url("assets/WhatsApp%20Image%202026-09-22%20at%2018.33.59.jpeg")
        center / cover no-repeat;

      color: white;
    }

    .hero-content {
      max-width: 850px;
    }

    .hero-content .eyebrow {
      text-transform: uppercase;
      letter-spacing: 3px;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 20px;
    }

    .hero-content h1 {
      font-size: clamp(48px, 7vw, 82px);
      line-height: 1;
      margin: 0 0 25px;
      letter-spacing: -3px;
    }

    .hero-content p {
      max-width: 700px;
      margin: auto;
      font-size: 19px;
      line-height: 1.8;
    }

    .hero-button {
      display: inline-block;
      margin-top: 32px;
      padding: 15px 28px;
      background: white;
      color: #111;
      text-decoration: none;
      border-radius: 10px;
      font-weight: 700;
    }

    .scooty-section {
      padding: 100px 20px;
    }

    .section-heading {
      text-align: center;
      max-width: 750px;
      margin: 0 auto 55px;
    }

    .section-heading h2 {
      font-size: 42px;
      margin: 0 0 15px;
    }

    .section-heading p {
      font-size: 17px;
      line-height: 1.8;
      opacity: .7;
    }

    .why-section {
      background: white;
    }

    .why-grid {
      max-width: 1100px;
      margin: auto;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 25px;
    }

    .why-card {
      padding: 35px 28px;
      text-align: center;
      border-radius: 18px;
      background: #faf9f5;
    }

    .why-icon {
      font-size: 35px;
      margin-bottom: 18px;
    }

    .why-card h3 {
      margin-bottom: 10px;
      font-size: 21px;
    }

    .why-card p {
      line-height: 1.7;
      opacity: .7;
    }

    .scooter-section {
      background: #f3f1ea;
    }

    .scooty-grid {
      max-width: 1100px;
      margin: auto;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 30px;
    }

    .scooty-card {
      background: white;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 12px 35px rgba(0,0,0,.08);
    }

    .scooty-card img {
      width: 100%;
      height: 330px;
      object-fit: cover;
      display: block;
    }

    .scooty-info {
      padding: 28px;
    }

    .scooty-info h3 {
      font-size: 27px;
      margin: 0 0 8px;
    }

    .scooty-price {
      font-size: 25px;
      font-weight: 800;
      margin-bottom: 15px;
    }

    .scooty-price span {
      font-size: 14px;
      font-weight: 400;
      opacity: .6;
    }

    .scooty-info p {
      line-height: 1.7;
      opacity: .7;
      margin-bottom: 22px;
    }

    .scooty-book {
      display: block;
      text-align: center;
      padding: 14px;
      border-radius: 9px;
      background: #111;
      color: white;
      text-decoration: none;
      font-weight: 700;
    }
