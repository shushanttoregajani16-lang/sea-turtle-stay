<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sea Turtle Stay | Admin</title>

<link rel="stylesheet" href="style.css">

<style>
body{
  background:#e8eee9;
}

.admin-wrap{
  width:min(900px,calc(100% - 32px));
  margin:60px auto;
}

.login,
.panel{
  background:var(--paper);
  border:1px solid var(--line);
  padding:30px;
  border-radius:24px;
  box-shadow:var(--shadow);
}

.login{
  max-width:420px;
  margin:80px auto;
}

.login label{
  display:block;
  margin-top:15px;
}

.login input{
  width:100%;
  padding:12px;
  border:1px solid var(--line);
  border-radius:10px;
  margin-top:8px;
  box-sizing:border-box;
}

.admin-grid{
  display:grid;
  gap:20px;
}

.admin-card{
  border:1px solid var(--line);
  padding:20px;
  border-radius:18px;
}

.admin-card input,
.admin-card textarea{
  width:100%;
  padding:10px;
  border:1px solid var(--line);
  border-radius:10px;
  margin-top:8px;
  box-sizing:border-box;
}

.admin-card input[type="checkbox"]{
  width:auto;
  margin-right:8px;
}

.row{
  display:grid;
  grid-template-columns:2fr 1fr;
  gap:12px;
}

.topbar{
  display:flex;
  justify-content:space-between;
  gap:15px;
  align-items:center;
  margin-bottom:20px;
}

.hint{
  font-size:.8rem;
  color:var(--muted);
  background:#fff3d9;
  padding:10px;
  border-radius:10px;
}

.scooty-preview{
  width:100%;
  max-width:220px;
  height:130px;
  object-fit:cover;
  border-radius:12px;
  margin-top:12px;
  border:1px solid var(--line);
}

@media(max-width:650px){
  .row{
    grid-template-columns:1fr;
  }

  .topbar{
    flex-direction:column;
    align-items:flex-start;
  }

  .admin-wrap{
    width:min(100% - 20px,900px);
    margin:30px auto;
  }

  .login,
  .panel{
    padding:20px;
  }
}
</style>
</head>

<body>

<!-- LOGIN -->

<div class="admin-wrap" id="loginView">

  <div class="login">

    <div class="eyebrow">Sea Turtle Stay</div>

    <h1 class="section-title" style="font-size:2.5rem">
      Admin <em>Dashboard</em>
    </h1>

    <p>Admin login.</p>

    <label>
      Email
      <input
        id="email"
        type="email"
        placeholder="Admin email"
        autocomplete="username"
      >
    </label>

    <label>
      Password
      <input
        id="password"
        type="password"
        placeholder="Enter password"
        autocomplete="current-password"
      >
    </label>

    <button
      class="btn btn-primary"
      id="loginBtn"
      style="width:100%;margin-top:15px"
    >
      Log in
    </button>

    <p class="hint">
      Sign in with your authorized admin account.
    </p>

  </div>

</div>


<!-- ADMIN DASHBOARD -->

<div class="admin-wrap" id="adminView" hidden>

  <div class="topbar">

    <div>
      <div class="eyebrow">Content management</div>

      <h1 class="section-title" style="font-size:2.8rem">
        Manage the <em>stay.</em>
      </h1>
    </div>

    <div>
      <a
        class="btn btn-outline"
        href="index.html"
      >
        View Website ↗
      </a>
    </div>

  </div>


  <div class="panel">

    <p class="hint">
      Changes are saved to the Sea Turtle Stay database.
      Once saved, the public website will use the updated information.
    </p>

    <div
      class="admin-grid"
      id="editor"
    ></div>

    <button
      class="btn btn-primary"
      id="saveBtn"
      style="margin-top:22px"
    >
      Save All Changes
    </button>

    <button
      class="btn btn-outline"
      id="logoutBtn"
      style="margin:22px 0 0 8px"
    >
      Log Out
    </button>

  </div>

</div>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="data.js"></script>


<script>

let draft;

const $ = s => document.querySelector(s);


/* =========================
   ADMIN EDITOR
========================= */

function editor(){

  let html = `

    <!-- CONTACT -->

    <div class="admin-card">

      <h3>Contact information</h3>

      <div class="row">

        <label>
          Phone
          <input
            data-c="phone"
            value="${draft.contact.phone || ""}"
          >
        </label>

        <label>
          WhatsApp
          <input
            data-c="whatsapp"
            value="${draft.contact.whatsapp || ""}"
          >
        </label>

      </div>

      <label>
        Location
        <input
          data-c="location"
          value="${draft.contact.location || ""}"
        >
      </label>

      <label>
        Email
        <input
          data-c="email"
          value="${draft.contact.email || ""}"
        >
      </label>

    </div>


    <!-- ROOMS -->

    <div class="admin-card">

      <h3>Rooms, prices & availability</h3>

  `;


  draft.rooms.forEach((r,i)=>{

    html += `

      <div
        style="
          padding:15px 0;
          border-top:1px solid var(--line)
        "
      >

        <div class="row">

          <label>
            Room name

            <input
              data-r="${i}"
              data-k="name"
              value="${r.name || ""}"
            >
          </label>

          <label>
            Price / night

            <input
              type="number"
              data-r="${i}"
              data-k="price"
              value="${r.price || 0}"
            >
          </label>

        </div>

        <label>
          Description

          <textarea
            data-r="${i}"
            data-k="description"
          >${r.description || ""}</textarea>

        </label>

        <label>

          <input
            type="checkbox"
            data-r="${i}"
            data-k="available"
            ${r.available !== false ? "checked" : ""}
          >

          Available to book

        </label>

      </div>

    `;

  });


  html += `

    </div>


    <!-- SCOOTY -->

    <div class="admin-card">

      <h3>🛵 Scooty Rental</h3>

      <p style="color:var(--muted);font-size:.9rem">
        Manage scooty names, daily prices and availability.
        Changes will be saved to Supabase.
      </p>

  `;


  if(Array.isArray(draft.scooty)){

    draft.scooty.forEach((s,i)=>{

      html += `

        <div
          style="
            padding:15px 0;
            border-top:1px solid var(--line)
          "
        >

          <h4 style="margin-bottom:12px">
            Scooty ${i + 1}
          </h4>

          <div class="row">

            <label>
              Scooty name

              <input
                data-s="${i}"
                data-k="name"
                value="${s.name || ""}"
              >
            </label>

            <label>
              Price / day

              <input
                type="number"
                min="0"
                data-s="${i}"
                data-k="price"
                value="${Number(s.price) || 0}"
              >
            </label>

          </div>

          <label>

            <input
              type="checkbox"
              data-s="${i}"
              data-k="available"
              ${s.available !== false ? "checked" : ""}
            >

            Available for rental

          </label>

          ${
            s.image
            ? `<img
                class="scooty-preview"
                src="${s.image}"
                alt="${s.name || "Scooty"}"
              >`
            : ""
          }

        </div>

      `;

    });

  }else{

    html += `

      <p style="color:#b00020">
        Scooty data is not available.
      </p>

    `;

  }


  html += `

    </div>


    <!-- HOW SAVING WORKS -->

    <div class="admin-card">

      <h3>How saving works</h3>

      <p>
        Changes made here are saved to Supabase.
        The public Sea Turtle Stay website reads the same data,
        so updated room and scooty prices and availability
        can appear publicly.
      </p>

    </div>

  `;


  $("#editor").innerHTML = html;

}


/* =========================
   LOGIN
========================= */

$("#loginBtn").onclick = async () => {

  const email = $("#email").value.trim();
  const password = $("#password").value;

  if(!email || !password){

    alert("Enter your email and password.");

    return;

  }

  const button = $("#loginBtn");

  button.disabled = true;
  button.textContent = "Logging in...";


  const { error } =
    await supabaseClient.auth.signInWithPassword({

      email: email,
      password: password

    });


  if(error){

    console.error("Login error:", error);

    alert("Login failed: " + error.message);

    button.disabled = false;
    button.textContent = "Log in";

    return;

  }


  draft = await getData();

  $("#loginView").hidden = true;
  $("#adminView").hidden = false;

  editor();

};


/* =========================
   SAVE CHANGES
========================= */

$("#saveBtn").onclick = async () => {


  /* CONTACT */

  document.querySelectorAll("[data-c]").forEach(x => {

    draft.contact[x.dataset.c] = x.value.trim();

  });


  /* ROOMS */

  document.querySelectorAll("[data-r]").forEach(x => {

    const index = Number(x.dataset.r);
    const key = x.dataset.k;

    if(!draft.rooms[index]) return;

    if(key === "price"){

      draft.rooms[index].price = Number(x.value);

    }
    else if(key === "available"){

      draft.rooms[index].available = x.checked;

    }
    else{

      draft.rooms[index][key] = x.value;

    }

  });


  /* SCOOTY */

  if(!Array.isArray(draft.scooty)){

    draft.scooty = [];

  }


  document.querySelectorAll("[data-s]").forEach(x => {

    const index = Number(x.dataset.s);
    const key = x.dataset.k;

    if(!draft.scooty[index]) return;


    if(key === "price"){

      draft.scooty[index].price = Number(x.value);

    }
    else if(key === "available"){

      draft.scooty[index].available = x.checked;

    }
    else{

      draft.scooty[index][key] = x.value;

    }

  });


  console.log("Scooty data before save:", draft.scooty);


  const button = $("#saveBtn");

  button.disabled = true;
  button.textContent = "Saving...";


  const success = await saveData(draft);


  if(success){

    console.log("Scooty data saved:", draft.scooty);

    alert(
      "Saved successfully!\n\n" +
      "Room and scooty changes have been saved to Supabase."
    );

  }else{

    alert(
      "Save failed.\n\n" +
      "Please check the browser console."
    );

  }


  button.disabled = false;
  button.textContent = "Save All Changes";

};


/* =========================
   LOGOUT
========================= */

$("#logoutBtn").onclick = async () => {

  await supabaseClient.auth.signOut();

  location.reload();

};


/* =========================
   ENTER KEY LOGIN
========================= */

$("#password").addEventListener("keydown", e => {

  if(e.key === "Enter"){

    $("#loginBtn").click();

  }

});

</script>

</body>
</html>
